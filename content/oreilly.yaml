# O'Reilly live events as la-vie learning paths, courses and lessons.
# Source: oreilly_events_06-Oct-26.md (compiled from Gmail on 6 Oct 2026); allocation approved 12 Oct 2026.
#
# Loaded at startup by app/content.py. Import adds items whose key it hasn't seen and fills
# in a link where an existing item has none; it never overwrites or deletes anything, so edits
# made in the admin page are kept. To add an event later, append a lesson with a new unique key;
# to add a recording link once it's issued, add `url:` to that lesson.
#
# Recording links are from the events file (Gmail recording emails). Older events link to
# learning.oreilly.com (My Events -> Past Events). Events without a recording yet have no url.

