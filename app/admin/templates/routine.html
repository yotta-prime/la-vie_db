{% extends "base.html" %}
{% from "_macros.html" import url_link %}
{% block content %}
<p><a href="/admin/movement">← Movement</a></p>
<h1>{{ r.name }}</h1>

<section>
  <form method="post" action="/admin/routines/{{ r.id }}">
    <div class="grid">
      <div><label>Name</label><input type="text" name="name" value="{{ r.name }}" required></div>
      <div><label>Duration (min)</label><input type="number" name="duration_min" min="1" value="{{ r.duration_min or '' }}"></div>
    </div>
    <div style="margin-top:10px">
      <label>Main video / link (optional)</label>
      <input type="url" name="url" value="{{ r.url or '' }}" placeholder="https://www.youtube.com/… or https://www.dailyom.com/…">
    </div>
    <div style="margin-top:10px"><label>Notes</label><textarea name="notes">{{ r.notes or '' }}</textarea></div>
    <div class="actions">
      <label class="check"><input type="checkbox" name="active" {{ 'checked' if r.active }}> Active</label>
      <button class="primary">Save</button>
    </div>
  </form>
</section>

<section>
  <h2>Items</h2>
  <ul class="list">
    {% for st in r.steps %}
    <li>
      <form method="post" action="/admin/routine-steps/{{ st.id }}" class="row">
        <span class="muted">{{ loop.index }}.</span>
        <input class="grow" type="text" name="text" value="{{ st.text }}">
        <input class="grow" type="url" name="url" value="{{ st.url or '' }}" placeholder="Video / link (optional)">
        <button class="icon">Save</button>
        <button class="icon" name="action" value="up" title="Move up">↑</button>
        <button class="icon" name="action" value="down" title="Move down">↓</button>
        <button class="icon danger" name="action" value="delete">Delete</button>
        {{ url_link(st.url, "open") }}
      </form>
    </li>
    {% else %}
    <li class="muted">No items yet.</li>
    {% endfor %}
  </ul>
  <form method="post" action="/admin/routines/{{ r.id }}/steps" class="row" style="margin-top:12px">
    <input class="grow" type="text" name="text" placeholder="Exercise or video title" required>
    <input class="grow" type="url" name="url" placeholder="Link (optional)">
    <button class="primary">Add item</button>
  </form>
</section>

<form method="post" action="/admin/routines/{{ r.id }}/delete" onsubmit="return confirm('Delete this routine?')">
  <button class="danger">Delete routine</button>
</form>
{% endblock %}
