name: test
# The NAS deploys a commit only after this workflow has passed on it (deploy/update.sh).
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Check the deploy script
        run: sh -n deploy/update.sh && shellcheck -S warning deploy/update.sh
