# On the NAS, deploy/update.sh sets LAVIE_ENV_FILE and LAVIE_DATA_DIR to paths outside the repo.
# Locally, the defaults (./.env and ./data) are used.
services:
  lavie:
    build:
      context: .
      args:
        APP_VERSION: ${LAVIE_VERSION:-dev}
    image: lavie:latest
    container_name: lavie
    restart: unless-stopped
    # Time to shut down cleanly on deploy (the bot finishes its current Telegram request)
    # before Docker kills it, which DSM would report as "stopped unexpectedly".
    stop_grace_period: 30s
    env_file:
      - ${LAVIE_ENV_FILE:-.env}
    environment:
      DATA_DIR: /data
    volumes:
      - ${LAVIE_DATA_DIR:-./data}:/data
    ports:
      # LAN only: don't forward this port on your router.
      - "8080:8000"
    # Hardening: read-only filesystem except /data and /tmp, no extra privileges.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
